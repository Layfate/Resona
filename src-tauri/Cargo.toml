[package]
name = "resona"
version = "0.1.0"
description = "Free, open-source AI audio restoration and enhancement"
authors = ["Resona contributors"]
license = "MIT"
repository = "https://github.com/Layfate/Resona"
edition = "2021"
rust-version = "1.80"

[lib]
name = "resona_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time", "fs"] }
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["protocol-asset", "test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
