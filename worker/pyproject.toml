[project]
name = "resona-worker"
version = "0.1.0"
description = "Audio restoration worker for the Resona desktop app"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "soundfile>=0.12.1,<1", "onnxruntime>=1.18,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
resona-worker = "resona_worker.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:resona_worker.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
