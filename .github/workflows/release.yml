name: Release

# Builds installers for every platform and attaches them to a draft GitHub
# release. Trigger by pushing a tag such as `v0.1.0`, or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft release once, up front. Letting each matrix job create it
  # races: parallel jobs each made their own draft for the same tag.
  create-release:
    name: Create draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG" -f name="Resona $TAG" -F draft=true -F prerelease=false \
              -f body="See CHANGELOG.md for what's new. Installers are not code-signed yet: Windows SmartScreen and macOS Gatekeeper will ask for confirmation on first launch. On first start Resona offers to download its AI engine (~100 MB, CPU)." \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    # Manual runs skip create-release and just build the installers as artifacts.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (.exe, .msi)
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon (.dmg)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel (.dmg)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux x64 (.AppImage, .deb, .rpm)
            os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Remove Python bytecode from bundled worker
        shell: bash
        run: find worker/resona_worker -name __pycache__ -type d -prune -exec rm -rf {} +

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing — configure these secrets to sign builds:
          # Windows: TAURI_SIGNING_PRIVATE_KEY (updater) / signtool via tauri.conf.json
          # macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #          APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Keep installers as workflow artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: ignore
